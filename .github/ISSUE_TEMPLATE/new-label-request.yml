name: New label request
description: Request a new label and define its governance boundaries.
title: "label: add <new-label-name>"
labels:
  - enhancement
  - help wanted
body:
  - type: input
    id: name
    attributes:
      label: Proposed label name
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What problem this label solves and who uses it.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: When to use and when not to use.
    validations:
      required: true
  - type: textarea
    id: automation
    attributes:
      label: Automation impact
      description: Any bot/workflow behavior tied to this label.
    validations:
      required: true
